<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#c7f13c" />
    <script>
      /* Apply the saved day/night choice before first paint (no white flash). */
      try {
        var savedTheme = localStorage.getItem("mytechflow_theme");
        if (
          savedTheme === "dark" ||
          (!savedTheme &&
            window.matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.dataset.theme = "dark";
          var themeMeta = document.querySelector(
            'meta[name="theme-color"]',
          );
          if (themeMeta) themeMeta.setAttribute("content", "#0e1512");
        }
      } catch (e) {}
    </script>
    <link rel="preload" as="image" href="/art/apps-atlas.webp" />

    <!-- Primary Meta Tags -->
    <title>MyTechFlow Labs | Web Portal & Application Ecosystem</title>
    <meta
      name="title"
      content="MyTechFlow Labs | Web Portal & Application Ecosystem"
    />
    <meta
      name="description"
      content="Explore MyTechFlow Labs - official apps portal for Lexi-Parcours, French Learner, TimeLog Pro, TCF Preparation Suite, Driver Earnings Tracker, and arcade games."
    />
    <meta
      name="keywords"
      content="MyTechFlow Labs, French Learner, TimeLog, TCF Prep, Driver Earnings Tracker, React, Supabase, Vercel"
    />
    <meta name="author" content="MyTechFlow Labs" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mytechflowlabs.com/" />
    <meta
      property="og:title"
      content="MyTechFlow Labs | Web Portal & Application Ecosystem"
    />
    <meta
      property="og:description"
      content="Explore live web applications: Lexi-Parcours, French Learner, TimeLog Pro, TCF Preparation Suite, Driver Earnings Tracker, and arcade games."
    />

    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-RJJK09C4DR"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-RJJK09C4DR");
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

</html>
