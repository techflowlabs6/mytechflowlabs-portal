apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mytechflowlabs-portal-ingress
  labels:
    app.kubernetes.io/name: mytechflowlabs-portal
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  tls:
    - hosts:
        - mytechflowlabs.com
        - www.mytechflowlabs.com
      secretName: mytechflowlabs-tls-secret
  rules:
    - host: mytechflowlabs.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mytechflowlabs-portal-svc
                port:
                  number: 80
    - host: www.mytechflowlabs.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mytechflowlabs-portal-svc
                port:
                  number: 80
